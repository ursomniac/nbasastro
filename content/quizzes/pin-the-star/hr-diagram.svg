<svg viewBox="0 0 820 700" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <!-- Temperature color bar gradient: hot (blue) left → cool (red) right -->
    <linearGradient id="tempBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#5588ff"/>
      <stop offset="18%"  stop-color="#99bbff"/>
      <stop offset="35%"  stop-color="#ddeeff"/>
      <stop offset="52%"  stop-color="#ffffcc"/>
      <stop offset="66%"  stop-color="#ffee88"/>
      <stop offset="82%"  stop-color="#ffaa44"/>
      <stop offset="100%" stop-color="#ff4411"/>
    </linearGradient>
    <!-- Glow for bright/hot stars -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Softer glow for cooler stars -->
    <filter id="softglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ── BACKGROUND ── -->
  <rect width="820" height="700" fill="#0d1421"/>

  <!-- ── PLOT AREA ── -->
  <!-- Y scale: y = 570 − (logL + 4) × 54  →  logL=6→y=30, logL=0→y=354, logL=−4→y=570 -->
  <!-- X scale: spectral type O→x=110…175, B→175…295, A→295…365, F→365…430, G→430…495, K→495…590, M→590…730 -->
  <rect x="110" y="20" width="620" height="570" fill="#060c16"/>

  <!-- Grid: horizontal (luminosity decades) -->
  <g stroke="#1a2a40" stroke-width="1">
    <line x1="110" y1="30"  x2="730" y2="30"/>   <!-- 10^6  -->
    <line x1="110" y1="138" x2="730" y2="138"/>  <!-- 10^4  -->
    <line x1="110" y1="246" x2="730" y2="246"/>  <!-- 10^2  -->
    <line x1="110" y1="354" x2="730" y2="354"/>  <!-- 10^0 Sun -->
    <line x1="110" y1="462" x2="730" y2="462"/>  <!-- 10^-2 -->
    <line x1="110" y1="570" x2="730" y2="570"/>  <!-- 10^-4 -->
  </g>

  <!-- Grid: vertical (spectral type boundaries) -->
  <g stroke="#1a2a40" stroke-width="1" stroke-dasharray="5,5">
    <line x1="175" y1="20" x2="175" y2="590"/>
    <line x1="295" y1="20" x2="295" y2="590"/>
    <line x1="365" y1="20" x2="365" y2="590"/>
    <line x1="430" y1="20" x2="430" y2="590"/>
    <line x1="495" y1="20" x2="495" y2="590"/>
    <line x1="590" y1="20" x2="590" y2="590"/>
  </g>

  <!-- Plot border -->
  <rect x="110" y="20" width="620" height="570" fill="none" stroke="#3a4a64" stroke-width="1.5"/>

  <!-- ── SPECTRAL CLASS LABELS (top) ── -->
  <g fill="#c5a059" font-size="17" font-weight="bold" text-anchor="middle">
    <text x="142" y="14">O</text>
    <text x="235" y="14">B</text>
    <text x="330" y="14">A</text>
    <text x="397" y="14">F</text>
    <text x="462" y="14">G</text>
    <text x="542" y="14">K</text>
    <text x="660" y="14">M</text>
  </g>

  <!-- ── Y-AXIS: LUMINOSITY ── -->
  <g fill="#8899bb" font-size="13" text-anchor="end">
    <text x="104" y="34">10⁶</text>
    <text x="104" y="142">10⁴</text>
    <text x="104" y="250">10²</text>
    <text x="104" y="358">1</text>
    <text x="104" y="466">10⁻²</text>
    <text x="104" y="574">10⁻⁴</text>
  </g>
  <!-- Y-axis title -->
  <text transform="translate(20,305) rotate(-90)" fill="#aabbcc" font-size="14" text-anchor="middle">Luminosity (L&#x2609;)</text>

  <!-- ── MAIN SEQUENCE: faint guide path ── -->
  <polyline
    points="135,54 150,81 165,108 185,142 215,178 252,210 295,248 335,270 370,287 408,307 450,328 480,350 515,376 555,406 595,441 635,478 665,511 695,543"
    fill="none" stroke="#c5a059" stroke-width="1" stroke-opacity="0.12"/>

  <!-- ═══════════════════════════════════════════════
       STARS — MAIN SEQUENCE
       S-curve per GAIA DR2: steep at O/B ends,
       shallower through A/F/G, steepening at M.
       ═══════════════════════════════════════════════ -->

  <!-- O stars: blue, largest -->
  <g filter="url(#glow)">
    <circle cx="135" cy="54"  r="13" fill="#4477ff"/>
    <circle cx="150" cy="81"  r="12" fill="#5588ff"/>
    <circle cx="163" cy="106" r="11" fill="#6699ff"/>
    <circle cx="171" cy="128" r="10" fill="#77aaff"/>
  </g>

  <!-- B stars: blue-white -->
  <g filter="url(#softglow)">
    <circle cx="190" cy="151" r="9"  fill="#99bbff"/>
    <circle cx="210" cy="172" r="8"  fill="#aaccff"/>
    <circle cx="232" cy="192" r="8"  fill="#bbccff"/>
    <circle cx="256" cy="210" r="7"  fill="#ccdeff"/>
    <circle cx="275" cy="227" r="7"  fill="#cce0ff"/>
  </g>

  <!-- A stars: white -->
  <g filter="url(#softglow)">
    <circle cx="300" cy="246" r="6.5" fill="#eeeeff"/>
    <circle cx="322" cy="258" r="6"   fill="#eef0ff"/>
    <circle cx="344" cy="268" r="6"   fill="#f5f5ff"/>
  </g>

  <!-- F stars: yellow-white -->
  <g>
    <circle cx="370" cy="280" r="5.5" fill="#fff8cc"/>
    <circle cx="392" cy="291" r="5.5" fill="#fff4b0"/>
    <circle cx="412" cy="301" r="5"   fill="#fff0a0"/>
  </g>

  <!-- G stars: yellow — Sun marked specially -->
  <g>
    <circle cx="435" cy="313" r="5"   fill="#ffee88"/>
    <!-- Sun -->
    <circle cx="458" cy="354" r="5.5" fill="#ffdd44" stroke="#ffffff" stroke-width="1.5"/>
    <text x="470" y="350" fill="#ffffff" font-size="11" font-family="sans-serif" opacity="0.75">&#x2609;</text>
    <circle cx="477" cy="344" r="5"   fill="#ffdd66"/>
  </g>

  <!-- K stars: orange -->
  <g>
    <circle cx="499" cy="358" r="4.5" fill="#ffbb55"/>
    <circle cx="520" cy="374" r="4.5" fill="#ffaa44"/>
    <circle cx="542" cy="390" r="4"   fill="#ff9933"/>
    <circle cx="560" cy="404" r="4"   fill="#ff9922"/>
  </g>

  <!-- M stars: red, smallest -->
  <g>
    <circle cx="582" cy="422" r="3.5" fill="#ff7733"/>
    <circle cx="601" cy="440" r="3.5" fill="#ff6622"/>
    <circle cx="622" cy="457" r="3"   fill="#ff5511"/>
    <circle cx="641" cy="474" r="3"   fill="#ff4411"/>
    <circle cx="660" cy="490" r="3"   fill="#ff3300"/>
    <circle cx="678" cy="507" r="2.5" fill="#ee2200"/>
    <circle cx="693" cy="524" r="2.5" fill="#dd2200"/>
  </g>

  <!-- ═══════════════════════════════════════════════
       STARS — GIANT BRANCH
       K/M giants: upper-right, logL ≈ 1.8–2.7
       y = 570 − (logL+4)×54:  logL=2→y=246, logL=2.5→y=219
       ═══════════════════════════════════════════════ -->
  <g filter="url(#softglow)">
    <circle cx="515" cy="232" r="11" fill="#ffbb55"/>
    <circle cx="540" cy="244" r="12" fill="#ffaa44"/>
    <circle cx="564" cy="237" r="11" fill="#ff9933"/>
    <circle cx="590" cy="250" r="13" fill="#ff8822"/>
    <circle cx="616" cy="242" r="12" fill="#ff7733"/>
    <circle cx="642" cy="253" r="11" fill="#ff6622"/>
    <circle cx="668" cy="246" r="10" fill="#ff5511"/>
    <circle cx="693" cy="238" r="11" fill="#ee4400"/>
    <!-- Slightly brighter outliers -->
    <circle cx="528" cy="212" r="10" fill="#ffcc66"/>
    <circle cx="558" cy="218" r="10" fill="#ffbb44"/>
    <circle cx="608" cy="224" r="9"  fill="#ff9933"/>
    <circle cx="660" cy="220" r="10" fill="#ff7733"/>
  </g>

  <!-- ═══════════════════════════════════════════════
       STARS — SUPERGIANTS
       Top band: logL ≈ 4.5–5.5  →  y = 57–111
       Span spectral types B through M.
       ═══════════════════════════════════════════════ -->
  <g filter="url(#glow)">
    <!-- B supergiants -->
    <circle cx="178" cy="74"  r="17" fill="#aaccff"/>
    <circle cx="212" cy="62"  r="18" fill="#99bbff"/>
    <circle cx="244" cy="82"  r="15" fill="#bbddff"/>
    <!-- A supergiant -->
    <circle cx="310" cy="76"  r="16" fill="#eeeeff"/>
    <!-- F supergiant -->
    <circle cx="388" cy="84"  r="17" fill="#fff8cc"/>
    <!-- G supergiant -->
    <circle cx="458" cy="90"  r="18" fill="#ffee88"/>
    <!-- K supergiant -->
    <circle cx="542" cy="80"  r="19" fill="#ffaa44"/>
    <!-- M supergiants — Betelgeuse-like -->
    <circle cx="620" cy="70"  r="21" fill="#ff6622"/>
    <circle cx="674" cy="62"  r="20" fill="#ff5511"/>
    <circle cx="712" cy="78"  r="17" fill="#ee4400"/>
  </g>

  <!-- ═══════════════════════════════════════════════
       STARS — WHITE DWARFS
       Lower-left: hot but dim, logL ≈ −3 to −4
       y = 516–570, x = 130–270
       ═══════════════════════════════════════════════ -->
  <g filter="url(#softglow)">
    <circle cx="138" cy="510" r="2"   fill="#ddeeff"/>
    <circle cx="153" cy="521" r="2"   fill="#ccddff"/>
    <circle cx="168" cy="531" r="2"   fill="#cce0ff"/>
    <circle cx="184" cy="539" r="2"   fill="#bbccff"/>
    <circle cx="201" cy="547" r="1.5" fill="#aabbff"/>
    <circle cx="220" cy="553" r="1.5" fill="#aabbee"/>
    <circle cx="240" cy="558" r="1.5" fill="#9999dd"/>
    <circle cx="260" cy="562" r="1.5" fill="#8899cc"/>
  </g>

  <!-- ═══════════════════════════════════════════════
       REGION LABELS
       ═══════════════════════════════════════════════ -->

  <!-- SUPERGIANTS — centered in supergiant zone, y=100 per v5 -->
  <text x="430" y="100" fill="#c0ccdd" font-size="14" font-style="italic" text-anchor="middle" opacity="0.72">SUPERGIANTS</text>

  <!-- GIANTS -->
  <text x="610" y="290" fill="#c0ccdd" font-size="14" font-style="italic" text-anchor="middle" opacity="0.72">GIANTS</text>

  <!-- MAIN SEQUENCE — rotated −62° at (295,320) per v5 -->
  <text transform="translate(295,320) rotate(-62)" fill="#c0ccdd" font-size="14" font-style="italic" text-anchor="middle" opacity="0.72">MAIN SEQUENCE</text>

  <!-- WHITE DWARFS -->
  <text x="196" y="492" fill="#c0ccdd" font-size="14" font-style="italic" text-anchor="middle" opacity="0.72">WHITE DWARFS</text>

  <!-- ── RADIUS SCALE NOTE ── -->
  <text x="116" y="598" fill="#445566" font-size="10" font-family="sans-serif">Circle size ∝ stellar radius</text>

  <!-- ── TEMPERATURE COLOR BAR ── -->
  <rect x="110" y="612" width="620" height="16" fill="url(#tempBar)" rx="2"/>
  <!-- Hot / Cool labels -->
  <text x="110" y="643" fill="#8899bb" font-size="12" font-family="sans-serif" text-anchor="start">&#x2190; Hotter</text>
  <text x="730" y="643" fill="#8899bb" font-size="12" font-family="sans-serif" text-anchor="end">Cooler &#x2192;</text>
  <!-- Spectral type labels below bar -->
  <g fill="#7788aa" font-size="11" font-family="sans-serif" text-anchor="middle">
    <text x="142" y="643">O</text>
    <text x="235" y="643">B</text>
    <text x="330" y="643">A</text>
    <text x="397" y="643">F</text>
    <text x="462" y="643">G</text>
    <text x="542" y="643">K</text>
    <text x="660" y="643">M</text>
  </g>

  <!-- ── TITLE ── -->
  <text x="420" y="690" fill="#c5a059" font-size="16" font-weight="bold" text-anchor="middle" font-family="Georgia, serif">Hertzsprung–Russell Diagram</text>

</svg>
