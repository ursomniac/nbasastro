<svg viewBox="0 0 740 440" xmlns="http://www.w3.org/2000/svg">
  <defs>

    <!--
      SCALE:  180px = 0.8 ly = 50,600 AU
              1px   ≈ 281 AU
      RINGS:  Outer OC: r = 68–180px  (19,000–50,600 AU)
              Inner OC: r =  0–68px   ( 1,900–19,000 AU  boundary at 68px)
      PATH:   y = 184  (46px above center = ~12,900 AU ≈ perihelion 12,800 AU)
    -->

    <!-- ── Single continuous gradient for the entire Oort Cloud disk ──
         Inner OC (r=0–38%) is denser; outer OC (r=38–100%) fades gradually.
         The boundary at 38% is a gentle slope, not a step — no seam. -->
    <radialGradient id="g-oc" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="white"   stop-opacity="0.32"/>
      <stop offset="22%"  stop-color="white"   stop-opacity="0.55"/>
      <stop offset="38%"  stop-color="white"   stop-opacity="0.45"/>
      <stop offset="54%"  stop-color="#d8e8ff" stop-opacity="0.36"/>
      <stop offset="72%"  stop-color="#c0d4f8" stop-opacity="0.26"/>
      <stop offset="87%"  stop-color="#a0b8e8" stop-opacity="0.13"/>
      <stop offset="96%"  stop-color="#8090c0" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#6070a0" stop-opacity="0"/>
    </radialGradient>

    <!-- ── Red arrowhead ── -->
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7.5" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e03030"/>
    </marker>
  </defs>

  <!-- ── Background ── -->
  <rect width="740" height="440" fill="#000000"/>

  <!-- ── Oort Cloud: single circle, single gradient — no seam ── -->
  <circle cx="380" cy="230" r="180" fill="url(#g-oc)"/>

  <!-- ── Inner Solar System (tiny dark dot — massively exaggerated) ── -->
  <circle cx="380" cy="230" r="4.5" fill="#000000"/>

  <!-- ── Gliese 710 path: blue dashed horizontal line at y=184 ── -->
  <line x1="0"   y1="184" x2="740" y2="184"
        stroke="#4a9aff" stroke-width="2.5" stroke-dasharray="12 7"/>

  <!-- ── Perihelion marker (red dot at closest approach) ── -->
  <circle cx="380" cy="184" r="4.5" fill="#e03030"/>

  <!-- ═══════════════════════════════════════════
       LABELS AND ANNOTATION ARROWS
       ═══════════════════════════════════════════ -->

  <!-- 1. "Path of Approaching Star" — upper left
       Arrow endpoint (163, 182): on the dashed line ✓ -->
  <text x="22" y="73" font-family="Arial, sans-serif" font-size="15"
        font-weight="bold" fill="#ffff00">Path of Approaching Star</text>
  <line x1="120" y1="77" x2="163" y2="182"
        stroke="#e03030" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- 2. "Outer Oort Cloud" — upper right
       Arrow endpoint (474, 163): dist from (380,230) = 115px — in outer ring ✓ -->
  <text x="512" y="89"  font-family="Arial, sans-serif" font-size="14"
        font-weight="bold" fill="#ffff00">Outer Oort Cloud</text>
  <text x="512" y="107" font-family="Arial, sans-serif" font-size="13"
        fill="#ffff00">~19,000 to 50,600 AU</text>
  <line x1="510" y1="95" x2="474" y2="163"
        stroke="#e03030" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- 3. "Inner Oort Cloud" — right middle
       Arrow endpoint (436, 242): dist from (380,230) = 57px — inside inner OC ✓ -->
  <text x="512" y="260" font-family="Arial, sans-serif" font-size="14"
        font-weight="bold" fill="#ffff00">Inner Oort Cloud</text>
  <text x="512" y="278" font-family="Arial, sans-serif" font-size="13"
        fill="#ffff00">~1,900 to 19,000 AU</text>
  <line x1="510" y1="263" x2="436" y2="242"
        stroke="#e03030" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- 4. "Inner Solar System" — lower left
       Arrow endpoint (374, 233): ~6.7px from center ✓
       Note that Neptune at 30 AU = 0.1px at this scale — dot is purely schematic -->
  <text x="22" y="373" font-family="Arial, sans-serif" font-size="13"
        font-weight="bold" fill="#ffff00">Inner Solar System</text>
  <text x="22" y="390" font-family="Arial, sans-serif" font-size="10.5"
        fill="#ffdd88">(to Neptune ≈ 30 AU — dot is vastly exaggerated)</text>
  <line x1="168" y1="366" x2="374" y2="233"
        stroke="#e03030" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- 5. Perihelion box — lower right (clear of all other labels)
       Arrow: (482, 350) → (387, 187) — verified no label crossings ✓ -->
  <rect x="482" y="335" width="250" height="72" fill="black" opacity="0.82" rx="3"/>
  <text x="488" y="352" font-family="Arial, sans-serif" font-size="12"
        font-weight="bold" fill="#ffcccc">Perihelion Passage</text>
  <text x="488" y="368" font-family="Arial, sans-serif" font-size="11.5"
        fill="#ffcccc">~12,800 AU  (0.0621 ± 0.002 pc)</text>
  <text x="488" y="384" font-family="Arial, sans-serif" font-size="11"
        fill="#c08888">Inside the Inner Oort Cloud</text>
  <text x="488" y="399" font-family="Arial, sans-serif" font-size="11"
        fill="#c08888">Closest approach in ~1.35 million years</text>
  <line x1="482" y1="350" x2="387" y2="188"
        stroke="#e03030" stroke-width="1.4" stroke-dasharray="4 2"
        marker-end="url(#arr)"/>

  <!-- ── Bottom note ── -->
  <text x="10" y="433" font-family="Arial, sans-serif" font-size="7.5"
        fill="#363636">Schematic — not to scale.
        Perihelion per Bailer-Jones et al. (2018); 0.0621 ± 0.0023 pc.
        Oort Cloud boundaries approximate.</text>

</svg>
