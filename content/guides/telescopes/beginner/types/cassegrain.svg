<svg xmlns="http://w3.org" viewBox="0 0 800 350" width="100%" height="100%">
  <rect width="800" height="350" fill="#ffffff"/>
  
  <!-- Tube Structure -->
  <rect x="150" y="60" width="450" height="180" fill="none" stroke="#333333" stroke-width="3"/>
  
  <!-- Split Primary Mirror (with Center Hole) -->
  <path d="M 590,65 Q 583,105 590,115" fill="none" stroke="#0066cc" stroke-width="8" stroke-linecap="round"/>
  <path d="M 590,185 Q 583,195 590,235" fill="none" stroke="#0066cc" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Curved Secondary Mirror (Convex) -->
  <path d="M 185,120 Q 195,150 185,180" fill="none" stroke="#666666" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Rear Eyepiece Outcrop -->
  <rect x="600" y="125" width="50" height="50" fill="none" stroke="#333333" stroke-width="2"/>
  
  <!-- Folded Light Path Cones -->
  <path d="M 80,75 L 588,75 L 187,130 L 670,150" fill="none" stroke="#ffaa00" stroke-width="1.5" stroke-dasharray="4,4"/>
  <path d="M 80,225 L 588,225 L 187,170 L 670,150" fill="none" stroke="#ffaa00" stroke-width="1.5" stroke-dasharray="4,4"/>
  <circle cx="670" cy="150" r="4" fill="#ff0000"/>
  
  <!-- APERTURE DIMENSION -->
  <line x1="625" y1="65" x2="625" y2="235" stroke="#cc0000" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="590" y1="65" x2="640" y2="65" stroke="#cc0000" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="590" y1="235" x2="640" y2="235" stroke="#cc0000" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="650" y="155" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#cc0000" va="middle">APERTURE (A)</text>
  
  <!-- EXPLANATORY OPTICAL SYSTEM FORMULA -->
  <rect x="150" y="270" width="500" height="50" fill="#f9f9f9" stroke="#008800" stroke-width="1.5" rx="5"/>
  <text x="400" y="300" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#008800" text-anchor="middle">
    EFFECTIVE FOCAL LENGTH = Primary Mirror FL × Secondary Mirror Magnification Factor
  </text>
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" height="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>
</svg>
