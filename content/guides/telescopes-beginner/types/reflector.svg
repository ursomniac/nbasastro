<svg xmlns="http://w3.org" viewBox="0 0 800 350" width="100%" height="100%">
  <rect width="800" height="350" fill="#ffffff"/>
  
  <!-- Main Tube -->
  <rect x="100" y="60" width="550" height="160" fill="none" stroke="#333333" stroke-width="3"/>
  <!-- Closed back wall -->
  <line x1="650" y1="60" x2="650" y2="220" stroke="#333333" stroke-width="3"/>
  
  <!-- Curved Primary Mirror -->
  <path d="M 635,65 Q 625,140 635,215" fill="none" stroke="#0066cc" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Flat Diagonal Secondary Mirror -->
  <line x1="200" y1="125" x2="230" y2="155" stroke="#666666" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Focuser/Eyepiece Outcrop -->
  <rect x="200" y="25" width="30" height="35" fill="none" stroke="#333333" stroke-width="2"/>
  
  <!-- Light Paths -->
  <path d="M 80,75 L 632,75 L 215,140 L 215,15" fill="none" stroke="#ffaa00" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 80,205 L 632,205 L 215,140 L 215,15" fill="none" stroke="#ffaa00" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="215" cy="15" r="4" fill="#ff0000"/>
  
  <!-- APERTURE DIMENSION -->
  <line x1="675" y1="65" x2="675" y2="215" stroke="#cc0000" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="635" y1="65" x2="690" y2="65" stroke="#cc0000" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="635" y1="215" x2="690" y2="215" stroke="#cc0000" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="705" y="145" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#cc0000" va="middle">APERTURE (A)</text>
  
  <!-- FOCAL LENGTH SEGMENT 1 -->
  <line x1="215" y1="250" x2="630" y2="250" stroke="#008800" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="215" y1="155" x2="215" y2="265" stroke="#008800" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="630" y1="215" x2="630" y2="265" stroke="#008800" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="422" y="275" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#008800" text-anchor="middle">FL SEGMENT 1 (Primary to Secondary)</text>
  
  <!-- FOCAL LENGTH SEGMENT 2 -->
  <line x1="150" y1="140" x2="150" y2="15" stroke="#008800" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="140" y1="140" x2="205" y2="140" stroke="#008800" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="140" y1="15" x2="205" y2="15" stroke="#008800" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="135" y="85" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#008800" text-anchor="end">FL SEGMENT 2</text>
  
  <!-- TOTAL MATH LABEL -->
  <text x="422" y="320" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">TOTAL FOCAL LENGTH = SEGMENT 1 + SEGMENT 2</text>
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" height="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>
</svg>
