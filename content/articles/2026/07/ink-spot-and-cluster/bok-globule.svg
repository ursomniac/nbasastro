<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="cloudGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#262420"/>
      <stop offset="60%" stop-color="#34312b"/>
      <stop offset="100%" stop-color="#403c34"/>
    </radialGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e0"/>
      <stop offset="100%" stop-color="#fff8e0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="900" height="560" fill="#0d1422"/>

  <!-- title -->
  <text x="450" y="42" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#e8edf7">
    What a dark nebula actually is
  </text>

  <!-- background star field, scattered across the whole right two-thirds -->
  <g id="background-stars" fill="#cdd9ee">
    <circle cx="600" cy="110" r="1.6"/>
    <circle cx="650" cy="170" r="1.3"/>
    <circle cx="700" cy="100" r="1.8"/>
    <circle cx="750" cy="160" r="1.4"/>
    <circle cx="800" cy="120" r="1.6"/>
    <circle cx="640" cy="350" r="1.5"/>
    <circle cx="700" cy="400" r="1.3"/>
    <circle cx="760" cy="360" r="1.6"/>
    <circle cx="810" cy="330" r="1.4"/>
    <circle cx="610" cy="260" r="1.4"/>
    <circle cx="850" cy="220" r="1.6"/>
    <circle cx="850" cy="400" r="1.3"/>
    <circle cx="550" cy="200" r="1.4"/>
    <circle cx="540" cy="320" r="1.5"/>
  </g>

  <!-- the cloud -->
  <path d="M 569.8,280.0 Q 569.8,280.0 559.6,302.8 Q 549.4,325.6 537.6,350.4 Q 525.7,375.2 492.2,377.5 Q 458.7,379.9 427.8,387.5 Q 396.9,395.0 369.4,381.4 Q 341.8,367.8 328.0,346.0 Q 314.1,324.2 298.3,302.1 Q 282.5,280.0 298.7,258.0 Q 314.9,236.0 327.5,213.3 Q 340.0,190.5 370.7,185.4 Q 401.3,180.2 430.1,179.9 Q 458.9,179.5 489.3,185.1 Q 519.8,190.7 547.4,207.6 Q 575.0,224.6 572.4,252.3 Z"
        fill="url(#cloudGrad)" stroke="#000" stroke-width="1"/>

  <!-- three background stars whose light is actually blocked: shown as
       small "ghost" outline circles INSIDE the cloud silhouette, with a
       short leader line out to a clear explanatory label below the
       cloud, rather than relying on near-zero opacity to read as
       "present but hidden" -->
  <g id="blocked-stars" fill="none" stroke="#5b6878" stroke-width="1.2" stroke-dasharray="2,2">
    <circle cx="390" cy="240" r="3"/>
    <circle cx="450" cy="290" r="3"/>
    <circle cx="410" cy="330" r="3"/>
  </g>

  <!-- foreground stars: clearly outside/at the edge of the cloud silhouette -->
  <g id="foreground-stars" fill="#fff8e0">
    <circle cx="300" cy="190" r="2.2"/>
    <circle cx="260" cy="280" r="2.0"/>
    <circle cx="310" cy="370" r="2.1"/>
    <circle cx="500" cy="200" r="1.9"/>
  </g>
  <g opacity="0.5">
    <circle cx="300" cy="190" r="6" fill="url(#starGlow)"/>
    <circle cx="310" cy="370" r="6" fill="url(#starGlow)"/>
  </g>

  <!-- a brighter foreground "anchor" star near the cloud's edge,
       echoing the orange/red star visible in the team's own image -->
  <circle cx="240" cy="360" r="9" fill="#ffb877"/>
  <circle cx="240" cy="360" r="16" fill="#ffb877" opacity="0.25"/>

  <!-- observer -->
  <g id="observer" transform="translate(60,280)">
    <circle r="14" fill="#3a4a63"/>
    <circle r="14" fill="none" stroke="#7d93b8" stroke-width="1.5"/>
    <text x="0" y="38" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#9fb0cc">Earth</text>
  </g>

  <!-- sightline -->
  <line x1="74" y1="280" x2="285" y2="280" stroke="#5b87c2" stroke-width="2"/>
  <line x1="285" y1="280" x2="600" y2="280" stroke="#5b87c2" stroke-width="2" stroke-dasharray="6,6" opacity="0.55"/>

  <!-- labels: foreground -->
  <text x="280" y="140" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#fff8e0">Foreground stars</text>
  <text x="280" y="160" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#c9d4e8">nearer than the cloud — still visible</text>

  <!-- labels: the globule -->
  <text x="430" y="280" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#d6d6d6">Bok globule</text>
  <text x="430" y="300" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#9a9a9a">cold, dense gas + dust</text>
  <text x="430" y="316" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#9a9a9a">~8&#8211;20 K &#183; 5&#8211;50 M&#9737; &#183; ~0.1&#8211;1 pc</text>

  <!-- labels: background -->
  <text x="700" y="60" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#cdd9ee">Background star field</text>
  <text x="700" y="80" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#9fb0cc">farther away than the cloud</text>

  <!-- callout box explaining the blocked stars, with leader lines to
       the three ghost circles -->
  <g>
    <line x1="390" y1="240" x2="160" y2="450" stroke="#5b6878" stroke-width="1" stroke-dasharray="2,3"/>
    <line x1="410" y1="330" x2="160" y2="450" stroke="#5b6878" stroke-width="1" stroke-dasharray="2,3"/>
    <rect x="40" y="450" width="280" height="50" rx="6" fill="#162033" stroke="#3a4a63" stroke-width="1"/>
    <text x="180" y="470" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#cdd9ee">Stars directly behind the cloud</text>
    <text x="180" y="486" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#9fb0cc">are blocked, not absent</text>
  </g>

  <text x="450" y="540" text-anchor="middle" font-family="sans-serif" font-size="13" font-style="italic" fill="#6f82a8">
    Not to scale. The "hole" you see in a star field is a shadow — not an empty patch of galaxy.
  </text>
</svg>
