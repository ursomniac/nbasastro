<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <title>2026 Perseid Meteor Shower — Projected ZHR</title>
  <desc>Line chart showing projected zenithal hourly rate rising from 15 in late July to a peak of 100 on August 12–13, then falling to 5 by August 24.</desc>

  <!-- Background -->
  <rect width="800" height="420" fill="#0d1b2a"/>

  <!-- Chart area: left=80, right=760, top=40, bottom=340 -->
  <!-- Y axis: 0=340, 100=40 → scale = 3 px per unit -->

  <!-- Grid lines at 0, 20, 40, 60, 80, 100 -->
  <g stroke="#1e3a5f" stroke-width="1">
    <line x1="80" y1="340" x2="760" y2="340"/>
    <line x1="80" y1="280" x2="760" y2="280"/>
    <line x1="80" y1="220" x2="760" y2="220"/>
    <line x1="80" y1="160" x2="760" y2="160"/>
    <line x1="80" y1="100" x2="760" y2="100"/>
    <line x1="80" y1="40"  x2="760" y2="40"/>
  </g>

  <!-- Y axis labels -->
  <g font-size="12" fill="#8899aa" text-anchor="end">
    <text x="72" y="344">0</text>
    <text x="72" y="284">20</text>
    <text x="72" y="224">40</text>
    <text x="72" y="164">60</text>
    <text x="72" y="104">80</text>
    <text x="72" y="44">100</text>
  </g>

  <!-- Y axis title -->
  <text transform="rotate(-90)" x="-190" y="18" font-size="12" fill="#8899aa" text-anchor="middle">Meteors per hour (ZHR)</text>

  <!-- Data points:
    13 points, x from 80 to 760, spacing = 680/12 = 56.67
    x positions: 80, 137, 193, 250, 307, 363, 420, 477, 533, 590, 647, 703, 760
    ZHR values: 15, 25, 30, 35, 40, 50, 75, 100, 85, 60, 45, 30, 5
    Y = 340 - (ZHR * 3)
  -->

  <!-- Filled area under curve -->
  <path d="M80,295 C108,280 125,265 137,265 C155,255 173,250 193,250 C212,245 230,232 250,232 C268,225 285,212 307,220 C325,215 343,195 363,190 C382,165 400,132 420,115 C438,90 456,55 477,40 C495,53 512,80 533,85 C552,105 570,125 590,160 C608,182 626,200 647,205 C665,215 682,225 703,250 C722,275 740,315 760,325 L760,340 L80,340 Z" fill="rgba(55,138,221,0.12)"/>

  <!-- Curve -->
  <path d="M80,295 C108,280 125,265 137,265 C155,255 173,250 193,250 C212,245 230,232 250,232 C268,225 285,212 307,220 C325,215 343,195 363,190 C382,165 400,132 420,115 C438,90 456,55 477,40 C495,53 512,80 533,85 C552,105 570,125 590,160 C608,182 626,200 647,205 C665,215 682,225 703,250 C722,275 740,315 760,325" fill="none" stroke="#378add" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Data points (non-peak) -->
  <g fill="#378add">
    <circle cx="80"  cy="295" r="4"/>
    <circle cx="137" cy="265" r="4"/>
    <circle cx="193" cy="250" r="4"/>
    <circle cx="250" cy="235" r="4"/>
    <circle cx="307" cy="220" r="4"/>
    <circle cx="363" cy="190" r="4"/>
    <circle cx="420" cy="115" r="4"/>
    <circle cx="533" cy="85"  r="4"/>
    <circle cx="590" cy="160" r="4"/>
    <circle cx="647" cy="205" r="4"/>
    <circle cx="703" cy="250" r="4"/>
    <circle cx="760" cy="325" r="4"/>
  </g>

  <!-- Peak point (red) -->
  <circle cx="477" cy="40" r="7" fill="#e24b4a"/>
  <circle cx="477" cy="40" r="11" fill="none" stroke="#e24b4a" stroke-width="1.5" opacity="0.5"/>

  <!-- Peak label -->
  <text x="477" y="28" font-size="12" fill="#e24b4a" text-anchor="middle" font-weight="bold">100</text>

  <!-- X axis labels -->
  <g font-size="10" fill="#8899aa" text-anchor="middle">
    <text x="80"  y="360" transform="rotate(-40,80,360)">Jul 20–Aug 5</text>
    <text x="137" y="360" transform="rotate(-40,137,360)">Aug 6</text>
    <text x="193" y="360" transform="rotate(-40,193,360)">Aug 7</text>
    <text x="250" y="360" transform="rotate(-40,250,360)">Aug 8</text>
    <text x="307" y="360" transform="rotate(-40,307,360)">Aug 9</text>
    <text x="363" y="360" transform="rotate(-40,363,360)">Aug 10</text>
    <text x="420" y="360" transform="rotate(-40,420,360)">Aug 11</text>
    <text x="477" y="360" transform="rotate(-40,477,360)" fill="#e24b4a">Aug 12 ★</text>
    <text x="533" y="360" transform="rotate(-40,533,360)">Aug 13</text>
    <text x="590" y="360" transform="rotate(-40,590,360)">Aug 14</text>
    <text x="647" y="360" transform="rotate(-40,647,360)">Aug 15</text>
    <text x="703" y="360" transform="rotate(-40,703,360)">Aug 16</text>
    <text x="760" y="360" transform="rotate(-40,760,360)">Aug 17–24</text>
  </g>

  <!-- Title -->
  <text x="420" y="22" font-size="15" fill="#cce0ff" text-anchor="middle" font-weight="500">2026 Perseid Meteor Shower — Projected ZHR</text>

  <!-- Legend -->
  <g font-size="11" fill="#8899aa">
    <rect x="540" y="55" width="10" height="10" rx="2" fill="#378add"/>
    <text x="555" y="64">Projected ZHR</text>
    <circle cx="545" cy="80" r="5" fill="#e24b4a"/>
    <text x="555" y="84">Peak (Aug 12–13)</text>
  </g>
</svg>
