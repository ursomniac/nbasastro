<svg viewBox="0 0 580 290" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">

  <rect width="580" height="290" fill="#060c18"/>

  <defs>
    <!-- Layered red glow (three overlapping gradients for richness) -->
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ff5577" stop-opacity="0.70"/>
      <stop offset="40%"  stop-color="#ee3355" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#cc1133" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ff4466" stop-opacity="0.40"/>
      <stop offset="55%"  stop-color="#dd2244" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#bb0022" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ee3355" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#990011" stop-opacity="0"/>
    </radialGradient>
    <!-- Star (hot, blue-white) -->
    <radialGradient id="hotStar" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="30%"  stop-color="#ddeeff"/>
      <stop offset="70%"  stop-color="#88aadd" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#88aadd" stop-opacity="0"/>
    </radialGradient>
    <!-- Soft blur for nebulosity -->
    <filter id="softBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <!-- Arrow markers -->
    <marker id="uvArr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,1 L0,6 L6.5,3.5 z" fill="#aa55ee"/>
    </marker>
    <marker id="haArr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,1 L0,6 L6.5,3.5 z" fill="#ff4466"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="290" y="22" fill="#c5a059" font-size="14" font-weight="bold" text-anchor="middle">Emission Nebula</text>

  <!-- === RED GLOW (three layers, centered on star at 290,130) === -->
  <!-- Blurred outer haze for softness -->
  <circle cx="290" cy="130" r="130" fill="#dd2244" fill-opacity="0.12" filter="url(#softBlur)"/>
  <!-- Gradient layers -->
  <circle cx="290" cy="130" r="48"  fill="url(#glow1)"/>
  <circle cx="290" cy="130" r="88"  fill="url(#glow2)"/>
  <circle cx="290" cy="130" r="130" fill="url(#glow3)"/>

  <!-- Ionization front (dashed boundary) -->
  <circle cx="290" cy="130" r="115" fill="none" stroke="#aa3344"
          stroke-width="1.2" stroke-dasharray="5,4" opacity="0.6"/>

  <!-- Hot O-type star -->
  <circle cx="290" cy="130" r="26"  fill="url(#hotStar)"/>
  <circle cx="290" cy="130" r="10"  fill="#eef2ff"/>

  <!-- UV radiation arrows (8 directions, every 45°)
       Star (290,130), r_inner=28, r_outer=88
       0°:   (318,130)→(378,130)
       45°:  (310,150)→(352,192)
       90°:  (290,158)→(290,218)
       135°: (270,150)→(228,192)
       180°: (262,130)→(202,130)
       225°: (270,110)→(228,68)
       270°: (290,102)→(290,42)
       315°: (310,110)→(352,68) -->
  <g stroke="#aa55ee" stroke-width="1.8" stroke-dasharray="3,2.5" marker-end="url(#uvArr)">
    <line x1="318" y1="130" x2="376" y2="130"/>
    <line x1="310" y1="150" x2="352" y2="192"/>
    <line x1="290" y1="158" x2="290" y2="216"/>
    <line x1="270" y1="150" x2="228" y2="192"/>
    <line x1="262" y1="130" x2="204" y2="130"/>
    <line x1="270" y1="110" x2="228" y2="68"/>
    <line x1="290" y1="102" x2="290" y2="44"/>
    <line x1="310" y1="110" x2="352" y2="68"/>
  </g>

  <!-- "UV" label near upper-right arrow tip (352,68) -->
  <text x="360" y="65" fill="#aa55ee" font-size="11">UV</text>

  <!-- In-glow label: what's happening inside the zone -->
  <text x="290" y="126" fill="#ffccdd" font-size="11" font-weight="bold" text-anchor="middle">ionized</text>
  <text x="290" y="141" fill="#ffccdd" font-size="11" font-weight="bold" text-anchor="middle">hydrogen</text>

  <!-- Hα emission arrow: from glow edge rightward toward observer -->
  <!-- Start just outside ionization front (x=408), going right to x=468 -->
  <line x1="410" y1="130" x2="468" y2="130" stroke="#ff4466" stroke-width="2.2" marker-end="url(#haArr)"/>
  <text x="476" y="127" fill="#ff6688" font-size="11">H&#945;</text>
  <text x="476" y="141" fill="#ee4455" font-size="10">656 nm</text>
  <text x="476" y="155" fill="#cc3344" font-size="9">→ observer</text>

  <!-- Ionization front label (below the dashed circle) -->
  <text x="290" y="256" fill="#884455" font-size="9" text-anchor="middle">— — — ionization front</text>

  <!-- Bottom explanation -->
  <text x="290" y="267" fill="#cc8899" font-size="11" text-anchor="middle">UV from the central O-type star strips electrons from hydrogen.</text>
  <text x="290" y="282" fill="#ff6677" font-size="11" text-anchor="middle">When they recombine, they emit H&#945; (656 nm) — the cloud glows its own red light.</text>

</svg>
