<svg viewBox="0 0 580 445" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="580" height="420" fill="#0a0f1a"/>

  <!-- Plot area: x=70–520, y=40–280 -->
  <rect x="70" y="40" width="450" height="240" fill="#060b14"/>
  <rect x="70" y="40" width="450" height="240" fill="none" stroke="#2a3a50" stroke-width="1.5"/>

  <!-- Spectral colour bar just below plot -->
  <defs>
    <linearGradient id="spec2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7700cc"/>
      <stop offset="12%"  stop-color="#4400ff"/>
      <stop offset="25%"  stop-color="#0055ff"/>
      <stop offset="38%"  stop-color="#00aaff"/>
      <stop offset="50%"  stop-color="#00cc44"/>
      <stop offset="62%"  stop-color="#aacc00"/>
      <stop offset="72%"  stop-color="#ffee00"/>
      <stop offset="82%"  stop-color="#ff6600"/>
      <stop offset="92%"  stop-color="#cc0000"/>
      <stop offset="100%" stop-color="#660000"/>
    </linearGradient>
  </defs>
  <rect x="70" y="283" width="450" height="11" fill="url(#spec2)" opacity="0.75"/>

  <!-- Grid -->
  <g stroke="#1a2535" stroke-width="0.8">
    <line x1="70"  y1="100" x2="520" y2="100"/>
    <line x1="70"  y1="160" x2="520" y2="160"/>
    <line x1="70"  y1="220" x2="520" y2="220"/>
  </g>

  <!-- X axis: 380–720nm → x = 70 + (λ-380)/340*450
       400→ 96,  450→163,  500→230,  550→296,  600→363,  650→430,  700→496 -->
  <g fill="#667788" font-size="11" text-anchor="middle">
    <text x="70"  y="308">380</text>
    <text x="163" y="308">450</text>
    <text x="256" y="308">520</text>
    <text x="349" y="308">590</text>
    <text x="443" y="308">660</text>
    <text x="520" y="308">720</text>
  </g>
  <text x="295" y="328" fill="#8899aa" font-size="13" text-anchor="middle">Wavelength (nm)</text>

  <!-- Y axis -->
  <g fill="#667788" font-size="11" text-anchor="end">
    <text x="64" y="44">1.0</text>
    <text x="64" y="104">0.75</text>
    <text x="64" y="164">0.50</text>
    <text x="64" y="224">0.25</text>
    <text x="64" y="284">0</text>
  </g>
  <text transform="translate(20,160) rotate(-90)" fill="#8899aa" font-size="13" text-anchor="middle">Relative sensitivity</text>

  <!-- ROD (scotopic) curve — peak 507nm → x≈243
       380→280, 420→273, 450→250, 480→162, 507→40(peak), 530→88, 560→192, 590→259, 620→274, 650→279 -->
  <polyline
    points="70,280 107,273 137,250 178,162 243,40 278,88 318,192 358,259 392,274 430,279 520,280"
    fill="none" stroke="#6699ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- CONE (photopic) curve — peak 555nm → x≈305
       380→280, 430→279, 460→266, 500→205, 530→68, 555→40(peak), 580→66, 610→162, 640→237, 670→272, 700→279 -->
  <polyline
    points="70,280 122,279 156,266 230,205 278,68 305,40 335,66 372,162 407,237 441,272 476,279 520,280"
    fill="none" stroke="#ffcc44" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Red zone (rods barely respond above ~640nm) -->
  <rect x="430" y="40" width="90" height="240" fill="#440000" opacity="0.20"/>

  <!-- ── ALL LABELS IN CLEAR SPACE ── -->

  <!-- Legend: horizontal row BELOW plot area, grouped so translate(x,y) moves everything -->
  <g transform="translate(120, 378)">
    <line x1="0" y1="6" x2="28" y2="6" stroke="#6699ff" stroke-width="2.5"/>
    <text x="34" y="10" fill="#6699ff" font-size="12">Rods (scotopic)</text>
    <line x1="190" y1="6" x2="218" y2="6" stroke="#ffcc44" stroke-width="2.5"/>
    <text x="224" y="10" fill="#ffcc44" font-size="12">Cones (photopic)</text>
  </g>

  <!-- Rod peak annotation: dashed vertical + label in margin BELOW x-axis
       507nm → x=243 -->
  <line x1="243" y1="40" x2="243" y2="280" stroke="#4466aa" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="243" y="350" fill="#6699ff" font-size="11" text-anchor="middle">507 nm</text>
  <text x="243" y="364" fill="#556677" font-size="10" text-anchor="middle">rod peak</text>

  <!-- Cone peak annotation: dashed vertical + label in margin BELOW x-axis
       555nm → x=305 -->
  <line x1="305" y1="40" x2="305" y2="280" stroke="#aa9922" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="305" y="350" fill="#ffcc44" font-size="11" text-anchor="middle">555 nm</text>
  <text x="305" y="364" fill="#556677" font-size="10" text-anchor="middle">cone peak</text>

  <!-- Red zone label: to the right of the plot in the right margin -->
  <text x="535" y="148" fill="#aa4444" font-size="11" text-anchor="start">rods</text>
  <text x="535" y="162" fill="#aa4444" font-size="11" text-anchor="start">barely</text>
  <text x="535" y="176" fill="#aa4444" font-size="11" text-anchor="start">respond</text>
  <!-- Arrow pointing left into red zone -->
  <line x1="533" y1="162" x2="523" y2="162" stroke="#883333" stroke-width="1"/>
  <polygon points="523,159 519,162 523,165" fill="#883333"/>

  <!-- Title and caption: pushed down so legend (text baseline y=388) clears title (top y=401) -->
  <text x="295" y="415" fill="#c5a059" font-size="14" font-weight="bold" text-anchor="middle">Spectral Sensitivity: Rods vs. Cones</text>
  <text x="295" y="433" fill="#667788" font-size="11" text-anchor="middle">Red light (above ~640nm) leaves rods almost untouched — which is why astronomers use it.</text>
</svg>
