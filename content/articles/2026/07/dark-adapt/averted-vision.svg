<svg viewBox="0 0 520 300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="520" height="300" fill="#0a0f1a"/>

  <!-- LEFT PANEL: Direct vision — object invisible -->
  <!-- Eyepiece circle -->
  <circle cx="130" cy="140" r="100" fill="#02050d" stroke="#3a4a64" stroke-width="2"/>
  <!-- Stars scattered -->
  <g fill="#ffffee">
    <circle cx="95"  cy="100" r="1.2"/>
    <circle cx="158" cy="88"  r="1.5"/>
    <circle cx="175" cy="130" r="1"/>
    <circle cx="88"  cy="165" r="1.3"/>
    <circle cx="150" cy="175" r="1"/>
    <circle cx="112" cy="195" r="1.5"/>
    <circle cx="170" cy="160" r="1.2"/>
    <circle cx="100" cy="130" r="1"/>
  </g>
  <!-- Target object: faint fuzzy at center — barely visible -->
  <circle cx="130" cy="140" r="7" fill="#ffffff" opacity="0.06"/>
  <circle cx="130" cy="140" r="4" fill="#ffffff" opacity="0.08"/>

  <!-- Gaze direction indicator: eye looking straight at center -->
  <line x1="130" y1="250" x2="130" y2="248" stroke="#446688" stroke-width="1.5"/>
  <!-- Crosshair at gaze point -->
  <line x1="124" y1="140" x2="136" y2="140" stroke="#cc4444" stroke-width="1" opacity="0.7"/>
  <line x1="130" y1="134" x2="130" y2="146" stroke="#cc4444" stroke-width="1" opacity="0.7"/>

  <text x="130" y="258" fill="#cc5555" font-size="12" text-anchor="middle">Direct gaze</text>
  <text x="130" y="272" fill="#667788" font-size="11" text-anchor="middle">Object invisible</text>

  <!-- Panel label -->
  <text x="130" y="30" fill="#8899aa" font-size="13" font-weight="bold" text-anchor="middle">Direct Vision</text>

  <!-- RIGHT PANEL: Averted vision — object visible -->
  <circle cx="390" cy="140" r="100" fill="#02050d" stroke="#3a4a64" stroke-width="2"/>
  <!-- Same stars -->
  <g fill="#ffffee">
    <circle cx="355" cy="100" r="1.2"/>
    <circle cx="418" cy="88"  r="1.5"/>
    <circle cx="435" cy="130" r="1"/>
    <circle cx="348" cy="165" r="1.3"/>
    <circle cx="410" cy="175" r="1"/>
    <circle cx="372" cy="195" r="1.5"/>
    <circle cx="430" cy="160" r="1.2"/>
    <circle cx="360" cy="130" r="1"/>
  </g>
  <!-- Target object: NOW visible — same position (center) but glowing -->
  <circle cx="390" cy="140" r="10" fill="#aaccff" opacity="0.12"/>
  <circle cx="390" cy="140" r="7"  fill="#aaccff" opacity="0.18"/>
  <circle cx="390" cy="140" r="4"  fill="#ccddff" opacity="0.30"/>

  <!-- Gaze direction: shifted to upper-right of object -->
  <!-- Crosshair placed ~20px up-right of center -->
  <line x1="404" y1="120" x2="416" y2="120" stroke="#44cc44" stroke-width="1" opacity="0.8"/>
  <line x1="410" y1="114" x2="410" y2="126" stroke="#44cc44" stroke-width="1" opacity="0.8"/>
  <!-- Arrow from gaze to object -->
  <line x1="400" y1="127" x2="393" y2="136" stroke="#44aa44" stroke-width="1" stroke-dasharray="2,2"/>

  <text x="390" y="258" fill="#44cc44" font-size="12" text-anchor="middle">Averted gaze</text>
  <text x="390" y="272" fill="#667788" font-size="11" text-anchor="middle">Object appears</text>

  <!-- Panel label -->
  <text x="390" y="30" fill="#8899aa" font-size="13" font-weight="bold" text-anchor="middle">Averted Vision</text>

  <!-- Center divider -->
  <line x1="260" y1="20" x2="260" y2="285" stroke="#1e2e46" stroke-width="1"/>

  <!-- Legend -->
  <line x1="170" y1="286" x2="185" y2="286" stroke="#cc4444" stroke-width="1.5"/>
  <text x="188" y="290" fill="#cc5555" font-size="10">= direct gaze point</text>
  <line x1="310" y1="286" x2="325" y2="286" stroke="#44cc44" stroke-width="1.5"/>
  <text x="328" y="290" fill="#44cc44" font-size="10">= averted gaze point</text>

  <!-- Title -->
  <text x="260" y="14" fill="#c5a059" font-size="13" font-weight="bold" text-anchor="middle">Averted Vision: Look Slightly Away from Your Target</text>
</svg>
