<svg viewBox="0 0 600 430" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="600" height="430" fill="#0a0f1a"/>

  <!-- Plot area: x=80–520, y=50–290 -->
  <rect x="80" y="50" width="440" height="240" fill="#060b14"/>
  <rect x="80" y="50" width="440" height="240" fill="none" stroke="#2a3a50" stroke-width="1.5"/>

  <!--
    X: degrees from fovea, −80° to +80°
    x = 80 + (deg+80)/160 * 440
    −80→80, −60→135, −40→190, −20→245, 0→300, 20→355, 40→410, 60→465, 80→520

    Y: receptor density 0–180k/mm²  (top = high density)
    y = 290 − density/180000 * 240
    0→290, 45k→230, 90k→170, 135k→110, 180k→50
  -->

  <!-- Grid -->
  <g stroke="#1a2535" stroke-width="0.8">
    <line x1="80"  y1="110" x2="520" y2="110"/>
    <line x1="80"  y1="170" x2="520" y2="170"/>
    <line x1="80"  y1="230" x2="520" y2="230"/>
    <line x1="135" y1="50"  x2="135" y2="290"/>
    <line x1="190" y1="50"  x2="190" y2="290"/>
    <line x1="245" y1="50"  x2="245" y2="290"/>
    <line x1="300" y1="50"  x2="300" y2="290"/>
    <line x1="355" y1="50"  x2="355" y2="290"/>
    <line x1="410" y1="50"  x2="410" y2="290"/>
    <line x1="465" y1="50"  x2="465" y2="290"/>
  </g>

  <!-- X axis labels -->
  <g fill="#667788" font-size="11" text-anchor="middle">
    <text x="80"  y="308">−80°</text>
    <text x="135" y="308">−60°</text>
    <text x="190" y="308">−40°</text>
    <text x="245" y="308">−20°</text>
    <text x="300" y="308">0°</text>
    <text x="355" y="308">20°</text>
    <text x="410" y="308">40°</text>
    <text x="465" y="308">60°</text>
    <text x="520" y="308">80°</text>
  </g>
  <text x="300" y="326" fill="#8899aa" font-size="12" text-anchor="middle">Degrees from center of gaze (fovea = 0°)</text>
  <text x="105" y="342" fill="#556677" font-size="10" text-anchor="middle">← temporal side</text>
  <text x="495" y="342" fill="#556677" font-size="10" text-anchor="middle">nasal side →</text>

  <!-- Y axis -->
  <g fill="#667788" font-size="11" text-anchor="end">
    <text x="74" y="54">180k</text>
    <text x="74" y="114">135k</text>
    <text x="74" y="174">90k</text>
    <text x="74" y="234">45k</text>
    <text x="74" y="294">0</text>
  </g>
  <text transform="translate(20,170) rotate(-90)" fill="#8899aa" font-size="12" text-anchor="middle">Receptors / mm²</text>

  <!-- Blind spot zone: ~12–18° nasal → x≈355+12/160*440 to 355+18/160*440 = 388–405 -->
  <rect x="386" y="50" width="22" height="240" fill="#220808" opacity="0.9"/>

  <!-- ROD curve (split around blind spot)
       Approx values:
       −80°(x=80): 60k→y=210
       −60°(x=135): 100k→y=157
       −40°(x=190): 120k→y=130
       −20°(x=245): 110k→y=143
       −10°(x=272): 50k→y=223
        −5°(x=286): 15k→y=270
         0°(x=300): 8k→y=279
         5°(x=314): 15k→y=270
        10°(x=327): 50k→y=223
        15°(x=341): 100k→y=157
       [blind spot gap x=386–408: rods also absent]
        20°(x=355): 120k→y=130
        40°(x=410): 120k→y=130
        60°(x=465): 100k→y=157
        80°(x=520): 70k→y=197
  -->
  <!-- Left of blind spot -->
  <polyline
    points="80,210 135,157 190,130 245,143 272,223 286,270 300,279 314,270 327,223 341,157 355,130 386,130"
    fill="none" stroke="#6699ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right of blind spot -->
  <polyline
    points="408,130 410,130 465,157 520,197"
    fill="none" stroke="#6699ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- CONE curve
       −80°(x=80):  3k→y=286
       −40°(x=190): 6k→y=282
       −20°(x=245): 12k→y=274
       −10°(x=272): 35k→y=244
        −5°(x=286): 100k→y=157
         0°(x=300): 180k→y=50 (fovea peak)
         5°(x=314): 100k→y=157
        10°(x=327): 35k→y=244
        20°(x=355): 10k→y=277
        40°(x=410): 5k→y=283
        80°(x=520): 3k→y=286
  -->
  <polyline
    points="80,286 135,284 190,282 245,274 272,244 286,157 300,50 314,157 327,244 355,277 410,283 465,285 520,286"
    fill="none" stroke="#ffcc44" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Fovea marker: dashed vertical -->
  <line x1="300" y1="50" x2="300" y2="290" stroke="#446644" stroke-width="1.2" stroke-dasharray="4,4"/>

  <!-- ── ALL LABELS IN CLEAR SPACE ── -->

  <!-- Legend box: upper-left.
       At x=80–135, rod≈210, cone≈286 — the zone y=50–180 is mostly clear (above both curves). -->
  <rect x="88" y="58" width="160" height="64" fill="#0a1020" stroke="#2a3a50" stroke-width="1" rx="3"/>
  <line x1="98" y1="76" x2="123" y2="76" stroke="#6699ff" stroke-width="2.5"/>
  <text x="128" y="80" fill="#6699ff" font-size="12">Rods</text>
  <line x1="98" y1="98" x2="123" y2="98" stroke="#ffcc44" stroke-width="2.5"/>
  <text x="128" y="102" fill="#ffcc44" font-size="12">Cones</text>

  <!-- Fovea label: in right margin, outside plot, with arrow -->
  <text x="528" y="46" fill="#558855" font-size="11">↑ fovea</text>
  <text x="528" y="59" fill="#556677" font-size="10">(0°, center</text>
  <text x="528" y="71" fill="#556677" font-size="10">of gaze)</text>

  <!-- Blind spot label: above the zone, pointing down -->
  <line x1="397" y1="46" x2="397" y2="52" stroke="#884444" stroke-width="1"/>
  <text x="397" y="40" fill="#884444" font-size="10" text-anchor="middle">blind spot</text>

  <!-- "Rod-rich zone" callout: in the LOWER part of the plot between the two curves
       At x=160, rod≈145, cone≈283. Gap center≈214. Put label at y=220, x=160. -->
  <text x="162" y="215" fill="#6699ff" font-size="11" text-anchor="middle" opacity="0.85">rod-rich zone</text>
  <text x="162" y="228" fill="#556677" font-size="10" text-anchor="middle">best for dim light</text>

  <!-- Title and caption -->
  <text x="300" y="368" fill="#c5a059" font-size="14" font-weight="bold" text-anchor="middle">Rod and Cone Distribution Across the Retina</text>
  <text x="300" y="388" fill="#667788" font-size="11" text-anchor="middle">Cones dominate the fovea (center of gaze). Rods peak ~15–20° off-center — the region used in averted vision.</text>
  <text x="300" y="405" fill="#667788" font-size="11" text-anchor="middle">Neither rods nor cones are present at the blind spot, where the optic nerve exits.</text>
</svg>
