<svg viewBox="0 0 600 690" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Duo-band filter transmission vs. planetary nebula emission lines</title>
  <desc>Chart showing the Seestar duo-band filter's two transmission windows, centered near 500 nanometers (covering hydrogen-beta and doubly-ionized oxygen) and near 656 nanometers (covering hydrogen-alpha and singly-ionized nitrogen), with the Saturn Nebula's key emission lines overlaid at their wavelengths. Everything between and outside the two windows is blocked, including most artificial light pollution.</desc>

  <rect width="600" height="690" fill="#0a0d12"/>

  <!-- Header -->
  <text x="300" y="40" text-anchor="middle" fill="#f0f3f7" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="600">Why a Duo-Band Filter Helps</text>
  <text x="300" y="61" text-anchor="middle" fill="#aab6c7" font-family="Helvetica, Arial, sans-serif" font-size="14">Seestar duo-band transmission (OIII/Hβ ~30 nm, Hα/[N II] ~20 nm)</text>
  <text x="300" y="81" text-anchor="middle" fill="#aab6c7" font-family="Helvetica, Arial, sans-serif" font-size="14">vs. planetary nebula emission lines</text>

  <!-- Plot frame -->
  <g font-family="Helvetica, Arial, sans-serif">
    <!-- horizontal gridlines at 0/20/40/60/80/100% -->
    <line x1="70" y1="610" x2="570" y2="610" stroke="#3a4658" stroke-width="1"/>
    <line x1="70" y1="512" x2="570" y2="512" stroke="#2a3542" stroke-width="1"/>
    <line x1="70" y1="414" x2="570" y2="414" stroke="#2a3542" stroke-width="1"/>
    <line x1="70" y1="316" x2="570" y2="316" stroke="#2a3542" stroke-width="1"/>
    <line x1="70" y1="218" x2="570" y2="218" stroke="#2a3542" stroke-width="1"/>
    <line x1="70" y1="120" x2="570" y2="120" stroke="#2a3542" stroke-width="1"/>
    <!-- y tick labels -->
    <g fill="#9aa7ba" font-size="13" text-anchor="end">
      <text x="62" y="614">0</text>
      <text x="62" y="516">20</text>
      <text x="62" y="418">40</text>
      <text x="62" y="320">60</text>
      <text x="62" y="222">80</text>
      <text x="62" y="124">100</text>
    </g>
    <!-- vertical gridlines every 50nm -->
    <g stroke="#2a3542" stroke-width="1">
      <line x1="70" y1="120" x2="70" y2="610"/>
      <line x1="141.4" y1="120" x2="141.4" y2="610"/>
      <line x1="212.9" y1="120" x2="212.9" y2="610"/>
      <line x1="284.3" y1="120" x2="284.3" y2="610"/>
      <line x1="355.7" y1="120" x2="355.7" y2="610"/>
      <line x1="427.1" y1="120" x2="427.1" y2="610"/>
      <line x1="498.6" y1="120" x2="498.6" y2="610"/>
      <line x1="570" y1="120" x2="570" y2="610"/>
    </g>
    <!-- x tick labels -->
    <g fill="#9aa7ba" font-size="13" text-anchor="middle">
      <text x="70" y="632">400</text>
      <text x="141.4" y="632">450</text>
      <text x="212.9" y="632">500</text>
      <text x="284.3" y="632">550</text>
      <text x="355.7" y="632">600</text>
      <text x="427.1" y="632">650</text>
      <text x="498.6" y="632">700</text>
      <text x="570" y="632">750</text>
    </g>
    <text x="320" y="660" text-anchor="middle" fill="#aab6c7" font-size="15">Wavelength (nm)</text>
    <text x="24" y="365" text-anchor="middle" fill="#aab6c7" font-size="15" transform="rotate(-90 24 365)">Transmission % / relative line strength</text>

    <!-- axes -->
    <line x1="70" y1="120" x2="70" y2="610" stroke="#5a6a80" stroke-width="1.5"/>
    <line x1="70" y1="610" x2="570" y2="610" stroke="#5a6a80" stroke-width="1.5"/>
  </g>

  <!-- filter transmission bands (trapezoids) -->
  <path d="M 177 610 L 199 130 L 227 130 L 249 610 Z" fill="#e8edf5" opacity="0.20" stroke="#dbe2ec" stroke-width="1.5"/>
  <path d="M 410 610 L 424 130 L 447 130 L 461 610 Z" fill="#e8edf5" opacity="0.20" stroke="#dbe2ec" stroke-width="1.5"/>

  <!-- blocked-gap annotation -->
  <line x1="255" y1="580" x2="405" y2="580" stroke="#7d8ba0" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="255" y1="573" x2="255" y2="587" stroke="#7d8ba0" stroke-width="1"/>
  <line x1="405" y1="573" x2="405" y2="587" stroke="#7d8ba0" stroke-width="1"/>
  <text x="330" y="600" text-anchor="middle" fill="#aab6c7" font-family="Helvetica, Arial, sans-serif" font-size="13">blocked — incl. most light pollution</text>

  <!-- emission lines -->
  <!-- Hβ 486.1nm -->
  <line x1="193" y1="610" x2="193" y2="414" stroke="#60a5fa" stroke-width="3"/>
  <circle cx="193" cy="414" r="3.5" fill="#60a5fa"/>
  <text x="150" y="404" text-anchor="end" fill="#60a5fa" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600">Hβ</text>
  <text x="150" y="418" text-anchor="end" fill="#60a5fa" font-family="Helvetica, Arial, sans-serif" font-size="10">486.1 nm</text>

  <!-- [O III] 495.9 + 500.7 nm -->
  <line x1="207" y1="610" x2="207" y2="291.5" stroke="#34d399" stroke-width="3"/>
  <circle cx="207" cy="291.5" r="3.5" fill="#34d399"/>
  <line x1="216" y1="610" x2="216" y2="193.5" stroke="#34d399" stroke-width="3"/>
  <circle cx="216" cy="193.5" r="3.5" fill="#34d399"/>
  <text x="255" y="183" text-anchor="start" fill="#34d399" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600">[O III]</text>
  <text x="255" y="197" text-anchor="start" fill="#34d399" font-family="Helvetica, Arial, sans-serif" font-size="10">495.9 / 500.7 nm</text>

  <!-- Hα + [N II] cluster (blended at this scale) -->
  <line x1="439" y1="610" x2="439" y2="389.5" stroke="#fb923c" stroke-width="3"/>
  <circle cx="439" cy="389.5" r="3.5" fill="#fb923c"/>
  <line x1="436" y1="610" x2="436" y2="242.5" stroke="#f87171" stroke-width="3"/>
  <circle cx="436" cy="242.5" r="3.5" fill="#f87171"/>
  <text x="480" y="232" text-anchor="start" fill="#f87171" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600">Hα + [N II]</text>
  <text x="480" y="246" text-anchor="start" fill="#f87171" font-family="Helvetica, Arial, sans-serif" font-size="10">656 / 655 / 658 nm</text>
</svg>
