    <line x1="70" y1="196" x2="188" y2="127" stroke="#5fb3ff" stroke-width="3" stroke-linecap="round"/>
    <text x="70" y="212" font-size="10.5" fill="#5fb3ff">orbital plane</text>
    <!-- small arc showing the angle -->
