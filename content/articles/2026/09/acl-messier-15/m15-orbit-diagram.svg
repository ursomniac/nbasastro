    <line x1="700" y1="714" x2="740" y2="714" stroke="#3f6693" stroke-width="2" stroke-dasharray="6,5"/>
    <text x="748" y="718" font-size="11" fill="#9aa6c4">farther / behind the disk</text>
  </g>

  <!-- Footer -->
  <text x="500" y="745" text-anchor="middle" font-size="11" fill="#6b7592">Orbital shape, size, and ~27&#176; tilt to scale (Baumgardt, Sollima, Hilker et al. 2023). Viewing angle and exact disk-crossing longitude are illustrative; the Sun's marked position on the disk is for scale only, not its true azimuth relative to M 15's orbit.</text>
</svg>
