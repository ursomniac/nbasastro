  <text x="560" y="290" text-anchor="middle" font-size="13" fill="#5fb3ff" font-weight="600">M 15's orbital path (e &#8776; 0.47)</text>

  <!-- node / disk-crossing points -->
  <circle cx="659.7" cy="353.8" r="5.5" fill="#8fa3c7" stroke="#0b0e14" stroke-width="1"/>
  <circle cx="407.9" cy="395.1" r="5.5" fill="#8fa3c7" stroke="#0b0e14" stroke-width="1"/>
  <text x="672" y="349" font-size="11.5" fill="#9aa6c4">disk crossing</text>
  <text x="396" y="410" font-size="11.5" fill="#9aa6c4" text-anchor="end">disk crossing</text>

  <!-- Galactic Center -->
  <g>
    <circle cx="500" cy="380" r="16" fill="#f2a900" opacity="0.18"/>
    <circle cx="500" cy="380" r="8" fill="#f2c94c"/>
    <text x="500" y="360" text-anchor="middle" font-size="13" font-weight="600" fill="#f2c94c">Galactic Center</text>
  </g>

  <!-- Perigalacticon -->
  <circle cx="430.9" cy="334.7" r="5.5" fill="#ff7a6e"/>
  <line x1="430.9" y1="334.7" x2="360" y2="300" stroke="#ff7a6e" stroke-width="1" opacity="0.6"/>
  <text x="352" y="285" text-anchor="end" font-size="12.5" font-weight="600" fill="#ff7a6e">Perigalacticon</text>
  <text x="352" y="301" text-anchor="end" font-size="11.5" fill="#ff9d92">~3.9 kpc (~12,700 ly)</text>

  <!-- Apogalacticon + "M15 now" combined marker (front, prominent) -->
  <circle cx="701.1" cy="492.9" r="9" fill="#ff9d4d" stroke="#0b0e14" stroke-width="1.5"/>
  <line x1="701.1" y1="492.9" x2="770" y2="510" stroke="#ff9d4d" stroke-width="1" opacity="0.7"/>
  <text x="776" y="498" font-size="12.5" font-weight="600" fill="#ff9d4d">Apogalacticon</text>
