  <text x="776" y="532" font-size="12.5" font-weight="600" fill="#ffce8a">M 15 is here now</text>
  <text x="776" y="548" font-size="11.5" fill="#c3cbe0">~5 Myr from apogalacticon</text>

  <!-- Sun -->
  <circle cx="332.7" cy="407.5" r="7" fill="#ffe066"/>
  <circle cx="332.7" cy="407.5" r="12" fill="#ffe066" opacity="0.2"/>
  <text x="332.7" y="429" text-anchor="middle" font-size="12.5" font-weight="600" fill="#ffe066">The Sun</text>
