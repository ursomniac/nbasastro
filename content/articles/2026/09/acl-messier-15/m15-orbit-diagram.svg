<svg viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="760" fill="#0b0e14"/>

  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" font-size="22" font-weight="600" fill="#e8ecf5">M 15's Orbit Around the Galactic Center</text>
  <text x="500" y="60" text-anchor="middle" font-size="13" fill="#8b96b3">A tilted 3D schematic, not a literal photograph -- shape and tilt are to scale, viewing angle is illustrative</text>

  <!-- ============ small inset: tilt explainer, top-left ============ -->
