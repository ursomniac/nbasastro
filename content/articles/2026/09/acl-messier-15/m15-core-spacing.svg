<svg viewBox="0 0 820 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="820" height="320" fill="#0b0e14"/>

  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="600" fill="#e8ecf5">How Crowded Is M 15's Core?</text>
  <text x="410" y="55" text-anchor="middle" font-size="12.5" fill="#8b96b3">Same linear scale, two very different neighborhoods</text>

  <!-- Sun's neighborhood row -->
  <text x="40" y="108" font-size="14" font-weight="600" fill="#e8ecf5">The Sun's neighborhood</text>
  <circle cx="60" cy="140" r="9" fill="#ffe066"/>
  <text x="60" y="168" text-anchor="middle" font-size="11" fill="#a9b4c9">Sun</text>
  <line x1="60" y1="140" x2="606" y2="140" stroke="#5a6a94" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="606" cy="140" r="6" fill="#ff7a6e"/>
  <text x="606" y="168" text-anchor="middle" font-size="11" fill="#a9b4c9">Proxima Centauri</text>
  <text x="333" y="128" text-anchor="middle" font-size="12.5" fill="#c3cbe0" font-weight="600">4.2 light-years</text>

  <!-- M15 core row -->
  <text x="40" y="230" font-size="14" font-weight="600" fill="#e8ecf5">M 15's collapsed core (typical spacing)</text>
  <circle cx="60" cy="260" r="9" fill="#5fb3ff"/>
  <text x="60" y="288" text-anchor="middle" font-size="11" fill="#a9b4c9">a core star</text>
  <line x1="60" y1="260" x2="126" y2="260" stroke="#5a6a94" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="126" cy="260" r="6" fill="#5fb3ff"/>
  <text x="93" y="248" text-anchor="middle" font-size="12.5" fill="#c3cbe0" font-weight="600">0.2-0.5 ly</text>
  <text x="126" y="288" text-anchor="middle" font-size="11" fill="#a9b4c9">nearest neighbor</text>

  <text x="410" y="308" text-anchor="middle" font-size="11" fill="#6b7592">Stars in M 15's core sit roughly 10-20&#215; closer together than the Sun's own nearest neighbors.</text>
</svg>
