name: Sync NBAS Calendar
on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight
  workflow_dispatch: # Allows you to run it manually

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install requests icalendar recurring_ical_events
      - name: Run sync
        run: python scripts/sync_calendar.py
      - name: Commit and push if changed
        run: |
          git config --global user.name 'NBAS Bot'
          git config --global user.email 'bot@nbasastro.org'
          git add assets/calendar/calendar_nbas.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-sync calendar"
          git pull --rebase origin main
          git push

