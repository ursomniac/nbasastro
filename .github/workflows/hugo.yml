name: Deploy
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  push:
    branches: ["main"]
  # Rebuilds every night at 00:05 UTC (approx. 8 PM ET)
  schedule:
    - cron: '5 0 * * *'
  # Allows you to manually trigger a build from the GitHub UI
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true
      - name: Fetch ISS passes
        env:
          N2YO_API_KEY: ${{ secrets.N2YO_API_KEY }}
        run: |
          mkdir -p static/data
          curl -s "https://api.n2yo.com/rest/v1/satellite/visualpasses/25544/42.7/-73.11/300/10/40/?apiKey=${N2YO_API_KEY}" \
            -o static/data/iss-passes.json
          echo "ISS passes fetched: $(jq '.info.passescount' static/data/iss-passes.json) passes"
      - run: hugo --minify
      - run: npx pagefind --site public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
