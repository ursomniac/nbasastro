name: Deploy

on:
  push:
    branches: ["main"]
  # NEW: Rebuilds every night at 00:05 UTC (approx. 8 PM ET)
  schedule:
    - cron: '5 0 * * *'
  # NEW: Allows you to manually trigger a build from the GitHub UI
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true
      - run: hugo --minify
      - run: npx pagefind --site public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

