# .github/workflows/iss-passes.yml
#
# Fetches upcoming ISS visual passes for the NBAS observing location
# and writes them to static/data/iss-passes.json for the sidebar widget.
#
# Runs nightly at 06:00 UTC (02:00 Eastern) so data is fresh each day.
# Can also be triggered manually from the Actions tab.
#
# Required secret: N2YO_API_KEY
# Set at: Settings → Secrets and variables → Actions → New repository secret

name: Fetch ISS Passes

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily
  workflow_dispatch:        # allow manual trigger

jobs:
  fetch-iss-passes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch ISS visual passes from N2YO
        env:
          N2YO_API_KEY: ${{ secrets.N2YO_API_KEY }}
        run: |
          # ISS NORAD ID: 25544
          # Location: Northern Berkshires (42.7N, 73.11W, ~220m elevation)
          # 10 days out, minimum 40 seconds visibility
          URL="https://api.n2yo.com/rest/v1/satellite/visualpasses/25544/42.7/-73.11/220/10/40/?apiKey=${N2YO_API_KEY}"

          echo "Fetching ISS passes..."
          curl -s "$URL" -o raw.json

          # Validate we got real data (not an error response)
          if ! jq -e '.passes' raw.json > /dev/null 2>&1; then
            echo "ERROR: API response did not contain passes array"
            cat raw.json
            exit 1
          fi

          PASS_COUNT=$(jq '.info.passescount' raw.json)
          echo "Got ${PASS_COUNT} passes"

          # Write to static data directory
          mkdir -p static/data
          cp raw.json static/data/iss-passes.json

          echo "Written to static/data/iss-passes.json"

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/data/iss-passes.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update ISS pass data [skip ci]"
            git push
          fi
