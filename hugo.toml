baseURL = "https://nbasastro.org"
languageCode = "en-us"
title = "Northern Berkshire Astronomical Society"

[params]
  subtitle = "Clear Skies over the Berkshires"
  banner = "images/m31_banner.jpg"
  logo = "images/nbas-grey.png"

[taxonomies]
  author = "authors"
  tag = "tags"

[permalinks]
  articles = "/articles/:year/:month/:title/"
  pages = "/:contentbasename/"

[related]
  threshold = 1
  includeNewer = true
  toLower = true

  [[related.indices]]
    name = "series"
    weight = 100  # A shared series is a perfect match

  [[related.indices]]
    name = "categories"
    weight = 80   # Shared categories are a strong match

  [[related.indices]]
    name = "tags"
    weight = 100   # Shared tags are a strong match
