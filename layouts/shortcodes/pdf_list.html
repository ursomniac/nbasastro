<ul class="list pl0">
  {{ range (readDir "static/library") }}
    {{ if and (not .IsDir) (not (hasPrefix .Name ".")) }}
      <li class="mb2">
        <a href="/library/{{ .Name }}" target="_blank" class="link blue hover-dark-blue underline">
          {{ .Name }}
        </a>
      </li>
    {{ end }}
  {{ end }}
</ul>
