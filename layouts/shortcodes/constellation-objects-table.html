<section class="constellation-reference-section" style="margin: 2.5rem 0; width: 100%; clear: both;">
  <h3 style="border-bottom: 2px solid #333; padding-bottom: 10px; color: #ffcc00;">Quick Reference: Objects of Interest</h3>
  <table class="nbas-spec-table" style="width: 100%; border-collapse: collapse; margin-top: 15px; background: #0f0f0f;">
    <thead>
      <tr style="background: #1a1a1a; color: #ffcc00; text-align: left;">
        <th style="padding: 12px; padding-left: 15px !important; border: 1px solid #333;">Object</th>
        <th style="padding: 12px; border: 1px solid #333;">Type</th>
        <th style="padding: 12px; border: 1px solid #333;">Equipment</th>
      </tr>
    </thead>
    <tbody>
      {{ range .Page.Params.highlights }}
      <tr>
        <td style="padding: 10px; padding-left: 15px !important; border: 1px solid #333;"><strong>{{ .name | safeHTML }}</strong></td>
        <td style="padding: 10px; border: 1px solid #333;">{{ .type }}</td>
        <td style="padding: 10px; border: 1px solid #333;">{{ .using }}</td>
      </tr>
      {{ end }}
    </tbody>
  </table>
</section>
