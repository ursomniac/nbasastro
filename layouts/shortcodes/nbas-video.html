<figure class="nbas-video-container">
    <div class="video-responsive-wrap">
        <iframe src="{{ .Get "src" }}" 
                title="{{ .Get "title" | default "NBAS Video" }}"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
        </iframe>
    </div>
    {{ with .Get "caption" }}
        <figcaption class="video-caption">{{ . }}</figcaption>
    {{ end }}
</figure>
