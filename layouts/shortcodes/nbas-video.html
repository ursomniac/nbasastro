<figure class="nbas-video-container" style="margin: 2rem auto; text-align: center; max-width: 90%;">
  <div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border: 2px solid #c5a059; border-radius: 4px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
    <iframe 
      src="https://youtube.com{{ .Get "id" }}" 
      style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;" 
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
      allowfullscreen>
    </iframe>
  </div>
  {{ with .Get "caption" }}
    <figcaption style="color: #aaaaaa; font-style: italic; font-size: 0.9rem; margin-top: 12px;">
      {{ . | markdownify }}
    </figcaption>
  {{ end }}
</figure>
