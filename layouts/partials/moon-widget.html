<div id="moon-container"></div>
<div class="moon-phase-label">
    <strong id="js-moon-name">Calculating...</strong>
    <div class="moon-meta">
        <span id="js-moon-illum"></span>% Illuminated<br>
        Age: <span id="js-moon-age"></span> days
    </div>
</div>

<script>
    function drawMoon() {
        const now = Math.floor(Date.now() / 1000);
        const newMoon = 1704944400; 
        const cycle = 2551443;
        const P = ((now - newMoon) % cycle) / cycle;
        const illumination = ((1 - Math.cos(2 * Math.PI * P)) / 2) * 100;
        let W = (P <= 0.5) ? 48 * Math.cos(Math.PI * (P / 0.5)) : 48 * Math.cos(Math.PI * ((P - 0.5) / 0.5));
        let sweep = (P <= 0.5) ? 1 : 0;
        const svgHTML = `<svg viewBox="0 0 100 100" class="moon-svg"><circle cx="50" cy="50" r="48" fill="#0d1421" /><path d="M 50 2 A ${Math.abs(W)} 48 0 0 ${sweep} 50 98 A 48 48 0 0 ${sweep === 1 ? 0 : 1} 50 2" fill="#c5a059" /></svg>`;
        document.getElementById('moon-container').innerHTML = svgHTML;
        document.getElementById('js-moon-illum').innerText = illumination.toFixed(1);
        document.getElementById('js-moon-age').innerText = (P * 29.53).toFixed(2);
        let name = "New Moon";
        if (P < 0.03) name = "New Moon";
        else if (P < 0.22) name = "Waxing Crescent";
        else if (P < 0.28) name = "First Quarter";
        else if (P < 0.47) name = "Waxing Gibbous";
        else if (P < 0.53) name = "Full Moon";
        else if (P < 0.72) name = "Waning Gibbous";
        else if (P < 0.78) name = "Last Quarter";
        else name = "Waning Crescent";
        document.getElementById('js-moon-name').innerText = name;
    }
    drawMoon();
</script>
