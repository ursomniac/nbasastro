<section class="social-share-container" data-pagefind-ignore>
    <h4 class="share-title">Share this Article:</h4>
    <div class="share-links">
        {{ $url := .Permalink }}
        {{ $title := .Title }}

        <!-- Facebook -->
        <a href="https://facebook.com/sharer/sharer.php?u={{ $url }}" 
           target="_blank" rel="noopener" class="share-btn fb">Facebook</a>

        <!-- Email -->
        <a href="mailto:?subject={{ $title }}&body=Check out this article from the Northern Berkshire Astronomical Society: {{ $url }}" 
           target="_blank" rel="noopener" class="share-btn email">Email</a>

        <!-- Copy Link (Client-side) -->
        <button onclick="navigator.clipboard.writeText('{{ $url }}'); alert('Link copied!');" 
                class="share-btn copy">Copy Link</button>
    </div>
</section>
