<!-- V0.15.1: DYNAMIC INTERNAL SIDEBAR -->
<aside class="nbas-sidebar members-sidebar">
  <h3 class="sidebar-heading">Members Area</h3>
  
  <nav class="members-nav">
    {{/* 1. Dashboard Link */}}
    <a href="/members/" class="sidebar-link {{ if eq .RelPermalink "/members/" }}active{{ end }}">Dashboard</a>

    {{/* 2. Range through Sub-Sections (Docs, How-To, etc.) */}}
    {{ $members := .Site.GetPage "section" "members" }}
    {{ range $members.Sections.ByWeight }}
      <div class="sidebar-group">
        <h4 class="sidebar-subheading">{{ .Title }}</h4>
        <ul class="sidebar-list">
          {{ range .Pages.ByTitle }}
            <li>
              <a href="{{ .RelPermalink }}" class="sidebar-sublink {{ if eq $.RelPermalink .RelPermalink }}active{{ end }}">
                {{ .LinkTitle }}
              </a>
            </li>
          {{ end }}
        </ul>
      </div>
    {{ end }}
  </nav>
</aside>
