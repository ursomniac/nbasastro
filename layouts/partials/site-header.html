{{ $featured_image := .Params.featured_image | default .Site.Params.featured_image }}
<header class="cover bg-top" style="background-image: url({{ if $featured_image }}{{ $featured_image | absURL }}{{ end }}); min-height: 200px;">
  <div class="bg-black-60">
    {{ partial "site-navigation.html" . }}
    <div class="tc-l pv3 ph3 ph4-ns">
      <h1 class="f2 f1-l fw2 white-90 mb0 lh-title">{{ .Title | default .Site.Title }}</h1>
    </div>
  </div>
</header>
