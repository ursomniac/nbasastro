{{ define "main" }}
<article class="nbas-article">
    
    <!-- 1. ABOVE TITLE: Feature -->
    {{ with .Params.feature }}
    <div class="article-series-label">
        {{ . }}
    </div>
    {{ end }}

    <h1 class="article-title">{{ .Title }}</h1>

    <!-- 2. BELOW TITLE: Author & Date -->
    <div class="article-metadata">
        {{ with .Params.author }}<span>By {{ . }}</span> | {{ end }}
        <time datetime="{{ .PublishDate.Format "2006-01-02" }}">{{ .PublishDate.Format "January 2, 2006" }}</time>
    </div>

    <!-- 3. BYLINE: Italicized with a subtle left border -->
    {{ with .Params.byline }}
    <div class="article-byline">
        {{ . }}
    </div>
    {{ end }}

    <hr class="article-separator">

    <!-- 4. ACTUAL CONTENT -->
    <div class="article-body">
        {{ .Content }}
    </div>

</article>
{{ end }}
