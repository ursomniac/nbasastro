{{ define "main" }}
  <!-- TIGHT HERO SECTION -->
  <div style="background: #0d1421; border-left: 4px solid #f1c40f; padding: 4px 20px; margin-bottom: 20px;">
    <div style="font-size: 1.1rem; line-height: 1.2; color: #ffffff;">
      {{ .Content }}
    </div>
  </div>

  <h2 style="color: #f1c40f; border-bottom: 1px solid #3a4a64; padding-bottom: 8px;">Latest from the Society</h2>
  
  {{ range (where .Site.RegularPages "Section" "articles") | first 5 }}
    <div style="display: flex; gap: 20px; margin-bottom: 30px; align-items: center;">
      <div style="flex: 0 0 100px;">
        <img src="/images/logo-grey.png" style="width: 100px; height: 100px; object-fit: contain; background: #0a0d14; border: 1px solid #3a4a64; padding: 10px;">
      </div>
      <div style="flex: 1;">
        <div style="color: #f1c40f; font-weight: bold; text-transform: uppercase; font-size: 0.8rem;">{{ .Params.feature }}</div>
        <a href="{{ .RelPermalink }}" style="color: #fff; font-size: 1.6rem; text-decoration: none; font-weight: bold;">{{ .Title }}</a>
        <div style="color: #999; font-size: 0.85rem;">{{ .Date.Format "Jan 2, 2006" }}</div>
      </div>
    </div>
  {{ end }}
{{ end }}
