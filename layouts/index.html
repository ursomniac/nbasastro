{{ define "main" }}
  <div class="flex-l mw9 center ph3 ph5-ns pv4">
    <!-- Left Sidebar: Utility & Info -->
    <aside class="w-100 w-30-l pr4-l br-l b--moon-gray">
      <h1 class="f3 lh-title fw9 mb3 mt0 pt3">{{ .Title }}</h1>
      <div class="f5 lh-copy mt0-ns mb4">
        {{ .Content }}
      </div>
      
      <!-- Placeholder for future Widgets/Services -->
      <div id="sidebar-widgets" class="mt4 bt pt3 b--light-gray">
        <h4 class="f6 ttu tracked gray">Quick Links</h4>
        <ul class="list pl0 f6">
          <li class="mv2"><a href="/about" class="link blue hover-dark-blue">About NBAS</a></li>
          <li class="mv2"><a href="/contact" class="link blue hover-dark-blue">Contact Us</a></li>
          <li class="mv2"><a href="/library" class="link blue hover-dark-blue">Document Library</a></li>
        </ul>
      </div>
    </aside>

    <!-- Right Main: The Feed -->
    <main class="w-100 w-70-l pl4-l">
      {{ partial "recent_articles.html" . }}
    </main>
  </div>
{{ end }}
