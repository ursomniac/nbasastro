# data/comets.yaml
# Manually curated list of comets worth showing in the SSO Comet Panel.
# Maintainer: review monthly. Add comets as they become viable, remove when faded.
# designation must match the JPL Horizons COMMAND string exactly.
# peak_magnitude is an estimate — flagged as uncertain in the UI.

comets:

  - designation: "C/2025 R3"
    name: "PanSTARRS"
    discovery_year: 2025
    type: "long-period"
    perihelion_date: "2026-04-19"
    perihelion_au: 0.39
    peak_magnitude: 8.0
    binocular: true
    telescope_required: false
    note: "Past perihelion and fading. Moving into southern sky — increasingly difficult
      from northern latitudes. Still worth tracking as it recedes."
    warning: "Now fading and moving south. Northern hemisphere observers may lose it soon."

  - designation: "10P"
    name: "Tempel 2"
    discovery_year: 1873
    type: "short-period"
    perihelion_date: "2026-07-25"
    perihelion_au: 1.42
    peak_magnitude: 7.0
    binocular: true
    telescope_required: false
    note: "Short-period comet returning on schedule. Expected to peak July–August 2026
      in Aquarius. Closest approach to Earth around August 3 at ~0.42 AU. Nucleus
      approximately 10.5 km diameter. A reliable performer."
    warning: null

  - designation: "169P"
    name: "NEAT"
    discovery_year: 2002
    type: "short-period"
    perihelion_date: "2026-08-25"
    perihelion_au: 0.60
    peak_magnitude: 11.0
    binocular: false
    telescope_required: true
    note: "Parent body of the Alpha Capricornid meteor shower. Evening sky object in
      August 2026, best seen from northern hemisphere early in the month before
      it closes on the Sun. Telescopic target only."
    warning: "Telescopic object — magnitude 10 to 12. Will move closer to Sun through September."

  - designation: "2P"
    name: "Encke"
    discovery_year: 1786
    type: "short-period"
    perihelion_date: "2027-02-07"
    perihelion_au: 0.34
    peak_magnitude: 6.0
    binocular: true
    telescope_required: false
    note: "One of the most famous short-period comets, orbital period ~3.3 years.
      Parent body of the Taurid meteor showers. Begins brightening December 2026,
      peaks late January to mid-February 2027. Good binocular object at maximum.
      Not yet visible — included for advance planning."
    warning: "Not yet observable — brightening from December 2026."

  - designation: "88P"
    name: "Howell"
    discovery_year: 1981
    type: "short-period"
    perihelion_date: "2026-03-18"
    perihelion_au: 1.36
    peak_magnitude: 10.0
    binocular: false
    telescope_required: true
    note: "Discovered by Ellen Howell in 1981. Orbital period 5.5 years. Passed
      perihelion March 18, 2026 and now fading. Currently in Aquarius/Capricornus
      region. Requires at least a 6-inch telescope. Good test target for the panel
      during initial development."
    warning: "Past perihelion and fading — currently around magnitude 14. Challenging
      target requiring large aperture."
