# One entry per miniseries.
# Key = the miniseries slug: must match each article's `miniseries`
# front matter and the folder under content/miniseries/.
#
# parts: the full plan, in order. Each part is matched to its live
# article by `miniseries-sequence` (= n). A part with no live article
# (not written yet, or dated in the future) shows as "Coming soon".
# Edit this list only when the plan changes, not when a part goes live.
measuring-astronomical-distances:
  title: "Measuring Astronomical Distances"
  total: 10
  description: "From the Earth-Sun distance to the edge of the observable universe: what astronomers' distance units mean, and how each one was actually measured."
  parts:
    - n: 1
      title: "Measuring Distance"
      blurb: "How far is far? Choosing the right ruler for the job."
    - n: 2
      title: "Distance at Solar System Scale"
      blurb: "Small worlds, big gaps: the AU and light-time."
    - n: 3
      title: "The Speed of Light"
      blurb: "Jupiter's moons, tilted starlight, a toothed wheel, and an exact number."
    - n: 4
      title: "Measuring the Astronomical Unit"
      blurb: "Three centuries of putting a scale bar on the Solar System."
    - n: 5
      title: "Parallax: 61 Cygni to Gaia"
      blurb: "Using Earth's orbit as a baseline to reach the stars."
    - n: 6
      title: "Parsecs vs. Light-Years"
      blurb: "Two rulers for the stars, and why astronomers prefer the stranger one."
    - n: 7
      title: "Distance at Galactic Scale"
      blurb: "Our own galaxy, measured in kiloparsecs."
    - n: 8
      title: "The Ladder Cracks"
      blurb: "Reaching other galaxies, and the surprises along the way."
    - n: 9
      title: "Velocities and the Hubble Tension"
      blurb: "Redshift as a ruler, and where it stops agreeing with itself."
    - n: 10
      title: "How Far Can We See?"
      blurb: "The edge of the observable universe, and why 'how far' stops having one answer."
