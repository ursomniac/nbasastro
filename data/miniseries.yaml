# One entry per miniseries.
# Key = the miniseries slug: must match each article's `miniseries`
# front matter and the folder under content/miniseries/.
#
# parts: the full plan, in order. Each part is matched to its live
# article by `miniseries-sequence` (= n). A part with no live article
# (not written yet, or dated in the future) shows as "Coming soon".
# Edit this list only when the plan changes, not when a part goes live.
measuring-astronomical-distances:
  title: "Measuring Astronomical Distances"
  total: 14
  description: "From the Earth-Sun distance to the edge of the observable universe: what astronomers' distance units mean, and how each one was actually measured."
  parts:
    - n: 1
      title: "Measuring Distance"
      blurb: "How far is far? Choosing the right ruler for the job."
    - n: 2
      title: "Distance at Solar System Scale"
      blurb: "Small worlds, big gaps: the AU and light-time."
    - n: 3
      title: "The Speed of Light"
      blurb: "Jupiter's moons, tilted starlight, a toothed wheel, and an exact number."
    - n: 4
      title: "Measuring the Astronomical Unit"
      blurb: "Three centuries of putting a scale bar on the Solar System."
    - n: 5
      title: "Parallax: 61 Cygni to Gaia"
      blurb: "Using Earth's orbit as a baseline to reach the stars."
    - n: 6
      title: "Parsecs vs. Light Years"
      blurb: "Two rulers for the stars, and how to get a feel for the stranger one"
    - n: 7
      title: "Building the Distance Ladder"
      blurb: "When parallax runs out: the first rungs of the distance ladder, and how each one was tested and repaired."
    - n: 8
      title: "Distance at Galactic Scale"
      blurb: "Mapping a galaxy from the inside, and what the distances revealed that nobody was looking for."
    - n: 9
      title: "A Tour of the Galaxy"
      blurb: "Visiting the Galaxy's other realms, in distances you can feel."
    - n: 10
      title: "The Local Group"
      blurb: "A Cepheid in Andromeda, and the moment the universe got bigger."
    - n: 11
      title: "Extending the Distance Ladder"
      blurb: "Brighter rungs for farther galaxies, calibrated on the ones we already trust."
    - n: 12
      title: "Distance at Extragalactic Scale"
      blurb: "Megaparsecs, groups, clusters, and the voids between them."
    - n: 13
      title: "Velocities and the Hubble Tension"
      blurb: "Redshift as a ruler, and where it stops agreeing with itself."
    - n: 14
      title: "How Far Can We See?"
      blurb: "The edge of the observable universe, and why 'how far' stops having one answer."
as-the-sky-turns:
  title: "As the Sky Turns"
  total: 7
  description: "One motion, Earth spinning about the celestial pole, explains the nightly turn of the stars, which ones never set, why each season has its own constellations, rotating smart-scope frames, and the changing tilt of the ecliptic and the Milky Way. Then the pole itself moves."
  parts:
    - n: 1
      title: "The Turning Sky"
      blurb: "Fifteen degrees an hour, east to west, around Polaris."
    - n: 2
      title: "Circumpolar"
      blurb: "Why some stars never set, others never rise, and how that changes when you travel north or south."
    - n: 3
      title: "When Is It Up?"
      blurb: "Four minutes earlier every night: the sidereal day, the meridian, and why each season has its own stars."
    - n: 4
      title: "Field Rotation"
      blurb: "Why your smart scope's frame turns, where it's worst, and what an equatorial mount does about it."
    - n: 5
      title: "The Tilted Road"
      blurb: "The ecliptic's 23.4° tilt, and why the Sun and planets ride high or low with the seasons."
    - n: 6
      title: "The Tilted River"
      blurb: "Why the Milky Way arches overhead on some evenings and hugs the horizon on others."
    - n: 7
      title: "Precession"
      blurb: "The slowest turn: pole stars change, the equinox drifts, and star charts carry a date."
